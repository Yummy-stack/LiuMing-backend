version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: liuming-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password123
      MYSQL_DATABASE: yuxi
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Redis 缓存
  redis:
    image: redis:7.0
    container_name: liuming-redis
    restart: always
    ports:
      - "6379:6379"

  # Qdrant 向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    container_name: liuming-qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"

  # Elasticsearch 全文检索
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0
    container_name: liuming-es
    restart: always
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  # MinIO 对象存储
  minio:
    image: minio/minio
    container_name: liuming-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    command: server /data --console-address ":9001"

  # 后端服务
  backend:
    build: .
    container_name: liuming-backend
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      elasticsearch:
        condition: service_started
    environment:
      # 覆盖 application.yml 中的配置
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yuxi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_AI_VECTORSTORE_QDRANT_HOST: qdrant
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      MINIO_ENDPOINT: http://minio:9000
